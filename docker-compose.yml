version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: corgi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corgi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corgi-network

  redis:
    image: redis:7-alpine
    container_name: corgi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corgi-network

  minio:
    image: minio/minio:latest
    container_name: corgi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - corgi-network

  prometheus:
    image: prom/prometheus:latest
    container_name: corgi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - corgi-network

  grafana:
    image: grafana/grafana:latest
    container_name: corgi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - corgi-network

  decision-service:
    build:
      context: .
      dockerfile: Dockerfile.decision-service
    container_name: corgi-decision-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corgi_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: corgi-documents
      LOG_LEVEL: DEBUG
      JWT_SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./decision_service:/app/decision_service
      - ./shared:/app/shared
    command: uvicorn decision_service.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - corgi-network

  document-service:
    build:
      context: .
      dockerfile: Dockerfile.document-service
    container_name: corgi-document-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corgi_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: corgi-documents
      LOG_LEVEL: DEBUG
      OCR_TIER1_ENABLED: "true"
      OCR_TIER2_ENABLED: "true"
      OCR_TIER3_ENABLED: "true"
      TIER3_PROVIDER: "gemini"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: "gemini-1.5-flash"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./document_service:/app/document_service
      - ./shared:/app/shared
    command: uvicorn document_service.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - corgi-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery-worker
    container_name: corgi-celery-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corgi_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: corgi-documents
      LOG_LEVEL: INFO
      OCR_TIER1_ENABLED: "true"
      OCR_TIER2_ENABLED: "true"
      OCR_TIER3_ENABLED: "true"
      TIER3_PROVIDER: "gemini"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: "gemini-1.5-flash"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./tasks:/app/tasks
      - ./shared:/app/shared
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - corgi-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery-worker
    container_name: corgi-celery-beat
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corgi_dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tasks:/app/tasks
      - ./shared:/app/shared
    command: celery -A tasks.celery_app beat --loglevel=info
    networks:
      - corgi-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  corgi-network:
    driver: bridge
